name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - a04e
      - main
      - master

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build a04e kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            device-tree-compiler zip unzip cpio rsync \
            python3 python3-pip git build-essential \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu ccache

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang-r383902
          key: aosp-clang-r383902-v1

      - name: Download Clang r383902
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/clang-r383902
          curl -fL --retry 5 --retry-delay 3 -o /tmp/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz"
          tar -xzf /tmp/clang.tar.gz -C ~/clang-r383902
          chmod +x ~/clang-r383902/bin/*

      - name: Setup CCache wrappers
        run: |
          mkdir -p ~/bin
          cat << 'EOF' > ~/bin/clang
          #!/bin/sh
          exec ccache $HOME/clang-r383902/bin/clang "$@"
          EOF
          cat << 'EOF' > ~/bin/clang++
          #!/bin/sh
          exec ccache $HOME/clang-r383902/bin/clang++ "$@"
          EOF
          chmod +x ~/bin/clang ~/bin/clang++
          
          mkdir -p ~/.ccache
          ccache -M 3G
          
          echo "$HOME/bin" >> $GITHUB_PATH
          echo "$HOME/clang-r383902/bin" >> $GITHUB_PATH

      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-a04e-${{ github.sha }}
          restore-keys: |
            ccache-a04e-

      - name: Configure and build kernel
        env:
          ARCH: arm64
          CC: clang
          HOSTCC: clang
          HOSTCXX: clang++
          CROSS_COMPILE: aarch64-linux-gnu-
          CLANG_TRIPLE: aarch64-linux-gnu-
          CCACHE_DIR: $HOME/.ccache
          CCACHE_COMPILERCHECK: content
        run: |
          export PATH=$HOME/bin:$HOME/clang-r383902/bin:$PATH
          
          echo "Generating defconfig..."
          make -C "$(pwd)" O="$(pwd)/out" \
            ARCH=arm64 CC=clang HOSTCC=clang HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-w -Wno-section-mismatch" \
            a04e_defconfig
          
          echo "Building kernel..."
          make -C "$(pwd)" O="$(pwd)/out" \
            ARCH=arm64 CC=clang HOSTCC=clang HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-w -Wno-section-mismatch" \
            -j"$(nproc)"
          
          echo "CCache Statistics:"
          ccache -s

      - name: Verify kernel image
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "Error: Kernel image was not built!"
            exit 1
          fi
          ls -lh out/arch/arm64/boot/Image.gz

      - name: Pack AnyKernel3 zip
        id: pack
        run: |
          set -e
          VERSION=$(make -s kernelversion)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          ZIP_NAME="AnyKernel3-a04e-${VERSION}-${SHORT_SHA}.zip"

          git clone --depth=1 https://github.com/fadlyandryanto/AnyKernel3.git ak3
          cp out/arch/arm64/boot/Image.gz ak3/Image.gz
          
          ( cd ak3 && zip -r9 "../${ZIP_NAME}" . -x ".git/*" -x ".github/*" -x "README.md" -x ".gitignore" )
          
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_NAME: ${{ steps.pack.outputs.zip_name }}
          VERSION: ${{ steps.pack.outputs.version }}
          SHORT_SHA: ${{ steps.pack.outputs.short_sha }}
        run: |
          TAG="a04e-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$ZIP_NAME" \
            --title "a04e — ${VERSION} (${SHORT_SHA})" \
            --notes "**Kernel:** \`${VERSION}\`  
          **Commit:** [\`${SHORT_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})  
          **Build:** #${GITHUB_RUN_NUMBER}  
          
          Flash via AnyKernel3 in a custom recovery (TWRP / OrangeFox)." \
            --latest
